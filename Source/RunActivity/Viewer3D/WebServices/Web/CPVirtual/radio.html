<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP Virtual · Rádio Solo–Comboio</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#edf2f4;background:#081014;--green:#55dc8b;--red:#d94b40;--yellow:#e7c55d;--case:#78858c;--case-dark:#59666d}*{box-sizing:border-box}body{margin:0}header{height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#182126;border-bottom:3px solid #e12830}header b{color:#e12830;font-size:23px;font-style:italic}.ok{color:#8ee2ad}main{max-width:1250px;margin:24px auto;padding:0 18px}.layout{display:grid;grid-template-columns:minmax(570px,760px) minmax(330px,1fr);gap:18px}.radio{background:var(--case);border:5px solid #111;border-radius:8px;padding:22px;box-shadow:0 12px 35px #0008,inset 0 0 0 2px #a7b0b5;color:#101619}.upper,.lower{border:5px solid #101619;border-radius:38px;padding:15px 22px;background:#7c8990;position:relative}.upper{display:grid;grid-template-columns:150px 1fr 115px;align-items:center;gap:22px}.alarm{height:93px;background:#050708;border:4px solid #1b2023;display:flex;gap:7px;align-items:center;justify-content:center}.alarm i{display:block;width:12px;height:52px;background:#d85c50}.alarm-label{text-align:center;font-size:19px;margin-top:5px}.reg-grid{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:10px}.key{min-height:58px;border:2px solid #4f4b38;border-radius:7px;background:var(--yellow);color:#171914;font-weight:800;box-shadow:inset 1px 1px #fff8,0 2px 1px #32383b;cursor:pointer}.key:active{transform:translateY(2px);box-shadow:inset 0 1px 3px #0008}.key.green{background:#63aa7b}.key.red{background:#dc5a4e}.key.grey{background:#aab1b4}.volume{text-align:center}.volume button{width:65px;height:51px;font-size:22px}.volume-bars{height:75px;display:flex;flex-direction:column-reverse;gap:3px;align-items:center;margin-bottom:6px}.volume-bars i{width:26px;height:7px;background:#50575a;border:1px solid #31383b}.volume-bars i.on{background:#db9843}.screen-row{display:grid;grid-template-columns:1fr 200px;gap:25px;align-items:center;margin:20px 70px 16px 175px}.lcd{background:#365c4d;border:5px solid #0a1012;border-radius:8px;padding:12px 25px;color:#60d481;font:20px Consolas,monospace;box-shadow:inset 0 0 14px #132a21}.lcd-top,.lcd-bottom{display:flex;justify-content:space-between}.brand-cp{font-size:31px;font-weight:900;font-style:italic;text-align:center}.model{text-align:center;font:700 18px Georgia,serif}.function-strip{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;margin:0 42px 12px}.function-strip button{height:27px;border-radius:7px;background:#aeb6b9;border:2px solid #4e595e;font-weight:800}.lower{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;border-radius:42px}.operations{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:8px}.operations .key{font-size:12px}.operations .danger{font-size:18px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:8px}.keypad .key{font-size:25px;min-height:63px}.radio-status{margin-top:15px;padding:9px 12px;background:#10191ddd;border-radius:5px;color:#bbcac8;font-size:12px}.side{background:#172126;border:1px solid #344149;border-radius:9px;padding:16px}.side h2{font-size:14px;margin:0 0 12px}.messages{height:440px;overflow:auto;background:#0d1519;border-radius:7px;padding:11px}.msg{border-left:3px solid #5d727c;padding:8px 10px;margin-bottom:8px;background:#121c21;font-size:13px}.msg.driver{border-color:#55dc8b}.msg.dispatcher{border-color:#ffd252}.msg small{display:block;color:#91a1a8;margin-bottom:4px}.compose{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:10px}.compose input{background:#0d1519;border:1px solid #4b5961;border-radius:5px;color:#fff;padding:10px;min-width:0}.compose button{border:1px solid #53636b;background:#26353c;color:#edf2f4;border-radius:5px;padding:8px 10px;cursor:pointer}.back{display:inline-block;color:#b9c6cc;text-decoration:none;margin-top:13px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.radio{min-width:650px}.side{min-width:650px}} 
</style></head><body>
<header><div><b>CP</b> VIRTUAL · RÁDIO SOLO–COMBOIO</div><div id="connection">A ligar…</div></header>
<main><div class="layout">
<section class="radio">
 <div class="upper">
  <div><div id="alarm" class="alarm"><i></i><i></i><i></i><i></i><i></i></div><div class="alarm-label">ALARME</div></div>
  <div class="reg-grid"><button class="key green" data-action="reg">REG</button><span></span><span></span><button class="key" data-action="review">REV</button><button class="key" data-action="review-reg">REV<br>REG</button><button class="key" data-action="end">FIM</button></div>
  <div class="volume"><div id="volumeBars" class="volume-bars"><i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><button class="key" data-volume="1">▲</button><div>VOLUME</div><button class="key" data-volume="-1">▼</button></div>
 </div>
 <div class="screen-row"><div class="lcd"><div class="lcd-top"><span id="lcdPost">CP-N</span><span>GR</span><span id="lcdChannel">62</span></div><div class="lcd-bottom"><span id="lcdMode">comboio</span><span id="lcdTrain">---</span></div></div><div><div class="brand-cp">CP</div><div class="model">DG 550 CP-11</div></div></div>
 <div class="function-strip"><button>🔊</button><button>☎</button><button>↔</button><button>G</button><button>AI</button><button>AN</button><button>M</button><button>R</button><button>•••</button><button>Y</button></div>
 <div class="lower">
  <div class="operations">
   <button class="key" data-send="Anúncio de passagem efetuado." data-kind="passage">ANÚNCIO<br>PASSAGEM</button><button class="key grey" data-action="indicator">●</button><button class="key" data-action="channel">CANAL<br>GRUPO</button>
   <button class="key red danger" data-send="Alarme geral do comboio. Necessito contacto imediato." data-kind="alarm">⚠ ALARME</button><button class="key red" data-send="Comboio imobilizado perante sinal fechado. Solicito instruções." data-kind="stop">🚦 STOP</button><button class="key red" data-send="Pedido urgente de proteção/apoio ao comboio." data-kind="emergency">BP</button>
   <button class="key" data-action="logout">↪</button><button class="key" data-send="Pedido de chamada ao controlador de tráfego." data-kind="call">☎ REV</button><button class="key" data-action="compose">✎</button>
   <button class="key" data-send="Mensagem recebida e compreendida." data-kind="ack">OK</button><button class="key" data-send="Pedido de autorização para ultrapassar sinal fechado." data-kind="permission">🚆 ➜</button><button class="key" data-action="test">TESTE</button>
   <button class="key" data-action="train-number">NUM<br>COMBOIO</button><button class="key" data-action="mode">MODO</button>
  </div>
  <div class="keypad"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key" data-action="enter">ENTRADA<br>NÚMERO</button><button class="key" data-digit="0">0</button><button class="key" data-action="cancel">ANUL</button></div>
 </div>
 <div id="radioStatus" class="radio-status">RSC pronto. Seleciona uma função ou transmite uma mensagem.</div>
</section>
<aside class="side"><h2>REGISTO DE COMUNICAÇÕES</h2><div id="messages" class="messages"><div class="msg"><small>SISTEMA</small>Canal iniciado.</div></div><div class="compose"><input id="text" maxlength="240" placeholder="Mensagem livre para o posto"><button id="send">TRANSMITIR</button></div><a class="back" href="/CPVirtual/">← Terminar/alterar serviço</a></aside>
</div></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),assignedTrain=Number(params.get('train')),duty=JSON.parse(localStorage.getItem('cpvDuty')||'{}');let trainNumber=assignedTrain,lastId=0,numericEntry='',volume=4;
$('lcdTrain').textContent=Number.isFinite(trainNumber)?trainNumber:'---';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(text,error=false){$('radioStatus').textContent=text;$('radioStatus').style.color=error?'#ffaaa6':'#c9e5d3'}
function renderVolume(){[...$('volumeBars').children].forEach((bar,i)=>bar.classList.toggle('on',i<volume))}
async function send(text,kind='radio'){text=String(text||'').trim();if(!text)return;status('A transmitir para o posto…');try{const r=await fetch('/API/CPV/RADIO',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({FromRole:'driver',FromName:duty.name||'Maquinista',TrainNumber:trainNumber,PostId:'',Kind:kind,Text:text})});const result=await r.json();if(!result.Accepted)throw new Error(result.Message);$('text').value='';status('TRANSMISSÃO CONFIRMADA · mensagem '+result.MessageId);if(kind==='alarm'){$('alarm').style.background='#55110d';setTimeout(()=>$('alarm').style.background='#050708',1800)}await refresh()}catch(e){status('FALHA RSC · '+e.message,true)}}
async function refresh(){try{const [rr,sr]=await Promise.all([fetch('/API/CPV/RADIO',{cache:'no-store'}),fetch('/API/CPV/STATE',{cache:'no-store'})]);if(!rr.ok||!sr.ok)throw new Error('sem ligação');const messages=(await rr.json()).filter(m=>m.TrainNumber===trainNumber||m.TrainNumber<0),state=await sr.json(),train=(state.Trains||[]).find(t=>t.Number===trainNumber);$('connection').textContent='● RSC LIGADO';$('connection').className='ok';$('lcdTrain').textContent=trainNumber;$('lcdMode').textContent=train?Number(train.SpeedKmh||0).toFixed(0)+' km/h':'comboio';$('messages').innerHTML=messages.length?messages.map(m=>'<div class="msg '+esc(m.FromRole)+'"><small>'+esc(m.FromName)+' · '+new Date(m.SentAtUtc).toLocaleTimeString()+'</small>'+esc(m.Text)+'</div>').join(''):'<div class="msg"><small>SISTEMA</small>Canal iniciado.</div>';if(messages.length&&messages[messages.length-1].MessageId!==lastId){lastId=messages[messages.length-1].MessageId;$('messages').scrollTop=$('messages').scrollHeight}}catch(e){$('connection').textContent='● RSC SEM LIGAÇÃO';$('connection').className='';status('SEM LIGAÇÃO AO POSTO',true)}}
document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>send(b.dataset.send,b.dataset.kind));document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{numericEntry=(numericEntry+b.dataset.digit).slice(-5);$('lcdTrain').textContent=numericEntry||trainNumber;status('Número introduzido: '+numericEntry)});document.querySelectorAll('[data-volume]').forEach(b=>b.onclick=()=>{volume=Math.max(0,Math.min(7,volume+Number(b.dataset.volume)));renderVolume();status('Volume '+volume)});
document.querySelector('[data-action="enter"]').onclick=()=>{if(numericEntry){trainNumber=Number(numericEntry);numericEntry='';status('Número de comboio selecionado: '+trainNumber)}};document.querySelector('[data-action="cancel"]').onclick=()=>{numericEntry='';$('lcdTrain').textContent=trainNumber;status('Introdução anulada')};document.querySelector('[data-action="test"]').onclick=()=>{status('TESTE DO TERMINAL · áudio, visor e canal operacionais');$('alarm').style.background='#3e2510';setTimeout(()=>$('alarm').style.background='#050708',1200)};document.querySelector('[data-action="compose"]').onclick=()=>$('text').focus();document.querySelector('[data-action="logout"]').onclick=()=>location.href='/CPVirtual/';document.querySelectorAll('[data-action]').forEach(b=>{if(!b.onclick)b.onclick=()=>status('Função '+b.textContent.trim()+' selecionada')});$('send').onclick=()=>send($('text').value);$('text').onkeydown=e=>{if(e.key==='Enter')send($('text').value)};renderVolume();refresh();setInterval(refresh,1000);
</script></body></html>
