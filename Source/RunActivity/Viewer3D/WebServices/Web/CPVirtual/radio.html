<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP Virtual · Rádio Solo–Comboio</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#edf2f4;background:#081014;--green:#55dc8b;--red:#d94b40;--yellow:#e7c55d;--case:#78858c;--case-dark:#59666d}*{box-sizing:border-box}body{margin:0}header{height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#182126;border-bottom:3px solid #e12830}header b{color:#e12830;font-size:23px;font-style:italic}.ok{color:#8ee2ad}main{max-width:1250px;margin:24px auto;padding:0 18px}.layout{display:grid;grid-template-columns:minmax(570px,760px) minmax(330px,1fr);gap:18px}.radio{background:var(--case);border:5px solid #111;border-radius:8px;padding:22px;box-shadow:0 12px 35px #0008,inset 0 0 0 2px #a7b0b5;color:#101619}.upper,.lower{border:5px solid #101619;border-radius:38px;padding:15px 22px;background:#7c8990;position:relative}.upper{display:grid;grid-template-columns:150px 1fr 115px;align-items:center;gap:22px}.alarm{height:93px;background:#050708;border:4px solid #1b2023;display:flex;gap:7px;align-items:center;justify-content:center}.alarm i{display:block;width:12px;height:52px;background:#d85c50}.alarm-label{text-align:center;font-size:19px;margin-top:5px}.reg-grid{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:10px}.key{min-height:58px;border:2px solid #4f4b38;border-radius:7px;background:var(--yellow);color:#171914;font-weight:800;box-shadow:inset 1px 1px #fff8,0 2px 1px #32383b;cursor:pointer}.key:active{transform:translateY(2px);box-shadow:inset 0 1px 3px #0008}.key.green{background:#63aa7b}.key.red{background:#dc5a4e}.key.grey{background:#aab1b4}.volume{text-align:center}.volume button{width:65px;height:51px;font-size:22px}.volume-bars{height:75px;display:flex;flex-direction:column-reverse;gap:3px;align-items:center;margin-bottom:6px}.volume-bars i{width:26px;height:7px;background:#50575a;border:1px solid #31383b}.volume-bars i.on{background:#db9843}.screen-row{display:grid;grid-template-columns:235px 190px;justify-content:center;gap:52px;align-items:center;margin:20px 0 16px}.lcd{min-width:235px}.lcd{background:#365c4d;border:5px solid #0a1012;border-radius:8px;padding:12px 25px;color:#60d481;font:20px Consolas,monospace;box-shadow:inset 0 0 14px #132a21}.lcd-top,.lcd-bottom{display:flex;justify-content:space-between}.brand-cp{font-size:31px;font-weight:900;font-style:italic;text-align:center}.model{text-align:center;font:700 18px Georgia,serif}.function-strip{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;margin:0 42px 12px}.function-strip button{height:27px;border-radius:7px;background:#aeb6b9;border:2px solid #4e595e;font-weight:800}.lower{display:grid;grid-template-columns:310px 280px;justify-content:space-between;gap:22px;border-radius:42px}.operations{display:grid;grid-template-columns:repeat(3,minmax(0,92px));grid-auto-rows:61px;gap:10px;padding:8px}.operations .key{font-size:11px;min-width:0;width:100%;height:61px}.operations .danger{font-size:15px}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,78px));grid-auto-rows:61px;justify-content:end;gap:10px;padding:8px}.keypad .key{font-size:23px;min-width:0;width:78px;height:61px;min-height:0}.keypad .key[data-action="enter"]{font-size:11px;line-height:1.15}.radio-status{margin-top:15px;padding:9px 12px;background:#10191ddd;border-radius:5px;color:#bbcac8;font-size:12px}.side{background:#172126;border:1px solid #344149;border-radius:9px;padding:16px}.side h2{font-size:14px;margin:0 0 12px}.messages{height:440px;overflow:auto;background:#0d1519;border-radius:7px;padding:11px}.msg{border-left:3px solid #5d727c;padding:8px 10px;margin-bottom:8px;background:#121c21;font-size:13px}.msg.driver{border-color:#55dc8b}.msg.dispatcher{border-color:#ffd252}.msg small{display:block;color:#91a1a8;margin-bottom:4px}.compose{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:10px}.compose input{background:#0d1519;border:1px solid #4b5961;border-radius:5px;color:#fff;padding:10px;min-width:0}.compose button{border:1px solid #53636b;background:#26353c;color:#edf2f4;border-radius:5px;padding:8px 10px;cursor:pointer}.back{display:inline-block;color:#b9c6cc;text-decoration:none;margin-top:13px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.radio{min-width:700px}.side{min-width:700px}} 
/* BG550 CP-N: fixed physical geometry, scaled only by the page layout. */
main{max-width:1420px}.layout{grid-template-columns:minmax(890px,940px) minmax(330px,1fr)}
.radio{width:100%;max-width:940px;border-radius:3px;padding:22px 25px 20px}
.upper{height:220px;padding:18px 28px;grid-template-columns:160px 1fr 125px;gap:30px}
.alarm{width:150px;height:112px}.alarm i{width:13px;height:58px}
.reg-grid{grid-template-columns:repeat(3,72px);grid-template-rows:62px 62px;gap:12px}.reg-grid .key{width:72px;height:62px;min-height:0}.reg-grid .green{grid-column:2}
.volume{display:grid;grid-template-columns:34px 68px;grid-template-rows:57px 20px 57px;align-items:center;justify-content:center}.volume-bars{grid-column:1;grid-row:1/4;height:78px;margin:0}.volume button{grid-column:2;width:68px;height:57px}.volume button[data-volume="1"]{grid-row:1}.volume>div:not(.volume-bars){grid-column:2;grid-row:2}.volume button[data-volume="-1"]{grid-row:3}
.screen-row{height:125px;grid-template-columns:300px 230px;gap:80px;margin:0}.lcd{width:300px;min-width:300px;height:94px;padding:13px 25px}
.function-strip{width:580px;grid-template-columns:repeat(10,49px);justify-content:center;gap:9px;margin:-2px auto 12px}.function-strip button{width:49px;padding:0;color:#111;font-size:13px}
.lower{height:390px;padding:26px 32px;grid-template-columns:410px 258px;gap:34px}
.operations{grid-template-columns:repeat(4,88px);grid-template-rows:repeat(4,68px);gap:14px 12px;padding:0;align-content:center}
.operations .key{font-size:11px;line-height:1.12;min-width:0;width:88px;height:68px;min-height:0}.operations .danger{font-size:15px}
.operations .key:nth-child(1){grid-area:1/1}.operations .key:nth-child(2){grid-area:1/4}.operations .key:nth-child(3){grid-area:2/4}.operations .key:nth-child(4){grid-area:2/1}.operations .key:nth-child(5){grid-area:2/2}.operations .key:nth-child(6){grid-area:2/3}.operations .key:nth-child(7){grid-area:3/1}.operations .key:nth-child(8){grid-area:3/2}.operations .key:nth-child(9){grid-area:3/3}.operations .key:nth-child(10){grid-area:4/1}.operations .key:nth-child(11){grid-area:4/2}.operations .key:nth-child(12){grid-area:4/3}.operations .key:nth-child(13){grid-area:3/4}.operations .key:nth-child(14){grid-area:4/4}
.key-symbol{display:block;font-size:22px;line-height:22px}.keypad{grid-template-columns:repeat(3,78px);grid-template-rows:repeat(4,68px);align-content:center;gap:14px 12px;padding:0}.keypad .key{font-size:25px;min-width:0;width:78px;height:68px;min-height:0}.keypad .key[data-action="enter"]{font-size:10px;line-height:1.12}
.radio-status{height:36px;margin-top:15px;padding:10px 12px}
@media(max-width:1200px){.layout{grid-template-columns:1fr}.radio,.side{min-width:890px}}
</style></head><body>
<header><div><b>CP</b> VIRTUAL · RÁDIO SOLO–COMBOIO</div><div id="connection">A ligar…</div></header>
<main><div class="layout">
<section class="radio">
 <div class="upper">
  <div><div id="alarm" class="alarm"><i></i><i></i><i></i><i></i><i></i></div><div class="alarm-label">ALARME</div></div>
  <div class="reg-grid"><span></span><button class="key green" data-action="reg">REG</button><span></span><button class="key" data-action="review">REV</button><button class="key" data-action="review-reg">REV<br>REG</button><button class="key" data-action="end">FIM</button></div>
  <div class="volume"><div id="volumeBars" class="volume-bars"><i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><button class="key" data-volume="1">▲</button><div>VOLUME</div><button class="key" data-volume="-1">▼</button></div>
 </div>
 <div class="screen-row"><div class="lcd"><div class="lcd-top"><span id="lcdPost">CP-N</span><span id="lcdGroup">GR</span><span id="lcdChannel">--</span></div><div class="lcd-bottom"><span id="lcdMode">comboio</span><span id="lcdTrain">---</span></div></div><div><div class="brand-cp">CP</div><div class="model">DG 550 CP-11</div></div></div>
 <div class="function-strip"><button title="Altifalante">◖))</button><button title="Telefone">☎</button><button title="Interfonia">⇄</button><button>G</button><button>AI</button><button>AN</button><button>M</button><button>R</button><button>•••</button><button>Y</button></div>
 <div class="lower">
  <div class="operations">
   <button class="key" data-send="ANUNCIO PASSAGEIROS OCUPADO" data-kind="status" data-source="1" data-message="14">ANÚNCIO<br>PASSAGEM</button><button class="key grey" data-action="indicator">●</button><button class="key" data-action="channel">CANAL<br>GRUPO</button>
   <button class="key red danger" data-send="Alarme geral do comboio. Necessito contacto imediato." data-kind="alarm"><span class="key-symbol">△</span>ALARME</button><button class="key red" data-send="COMB PARADO A UM SINAL" data-kind="status" data-source="1" data-message="3"><span class="key-symbol">▥</span>STOP</button><button class="key red" data-send="Pedido urgente de proteção/apoio ao comboio." data-kind="emergency"><span class="key-symbol">╱ BP</span></button>
   <button class="key" data-action="logout"><span class="key-symbol">□→</span></button><button class="key" data-send="CHAMADA DO REVISOR" data-kind="status" data-source="1" data-message="5"><span class="key-symbol">☎</span>REV</button><button class="key" data-action="compose"><span class="key-symbol">▰</span></button>
   <button class="key" data-send="MENSAGEM DO REG ENTENDIDA" data-kind="status" data-source="1" data-message="7">OK</button><button class="key" data-send="PEDIDO PARA PASSAR A SIMPLEX" data-kind="status" data-source="1" data-message="8"><span class="key-symbol">▭→</span></button><button class="key" data-action="test">TESTE</button>
   <button class="key" data-action="train-number">NUM<br>COMBOIO</button><button class="key" data-action="mode">MODO</button>
  </div>
  <div class="keypad"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key" data-action="enter">ENTRADA<br>NÚMERO</button><button class="key" data-digit="0">0</button><button class="key" data-action="cancel">ANUL</button></div>
 </div>
</section>
<aside class="side"><h2>REGISTO DE COMUNICAÇÕES</h2><div id="messages" class="messages"><div class="msg"><small>SISTEMA</small>RSC iniciado.</div></div><div class="compose"><input id="text" maxlength="240" placeholder="Mensagem livre para o posto"><button id="send">TRANSMITIR</button></div><div id="radioStatus" class="radio-status">RSC por registar. Confirma o número do comboio e o grupo.</div><a class="back" href="/CPVirtual/">← Terminar/alterar serviço</a></aside>
</div></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),assignedTrainParam=params.get('train'),duty=JSON.parse(localStorage.getItem('cpvDuty')||'{}');
const simulatorTrainNumber=assignedTrainParam===null?Number(duty.train):Number(assignedTrainParam);let serviceNumber=Number(duty.serviceNumber)||simulatorTrainNumber,lastId=0,numericEntry='',entryMode='',volume=4,registered=false,currentPost=null,radioChannel='',radioGroup='62',lastReceived=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(text,error=false){$('radioStatus').textContent=text;$('radioStatus').style.color=error?'#ffaaa6':'#c9e5d3'}
function display(){ $('lcdPost').textContent='CP-N';$('lcdGroup').textContent='GR';$('lcdChannel').textContent=entryMode==='group'?(numericEntry||'_'):radioGroup||'--';$('lcdTrain').textContent=entryMode==='train'?(numericEntry||'_'):(Number.isFinite(serviceNumber)?serviceNumber:'---');$('lcdMode').textContent=registered?'registado':'comboio'}
function renderVolume(){[...$('volumeBars').children].forEach((bar,i)=>bar.classList.toggle('on',i<volume))}
async function loadPost(){try{const c=await (await fetch('/CPVirtual/pt79-schematics.json',{cache:'no-store'})).json();currentPost=(c.posts||[])[0]||null;const r=currentPost&&currentPost.radio||{};radioChannel='';radioGroup=String(r.group||'62');display();status('Posto '+(currentPost?.dispatcherPost||'não definido')+' · GR '+radioGroup+' · seleção automática da estação-base · prima REG')}catch(e){radioGroup='62';display();status('Configuração do posto indisponível; GR 62 selecionado.',true)}}
async function send(text,kind='radio',allowUnregistered=false,sourceDestination=0,messageIdentifier=0){
 text=String(text||'').trim();if(!text)return false;
 if(!registered&&!allowUnregistered&&!['alarm','emergency'].includes(kind)){status('PRIMEIRO REGISTA O TERMINAL · confirma comboio e grupo, depois prime REG',true);return false}
 const payload={FromRole:'driver',FromName:duty.name||'Maquinista',TrainNumber:simulatorTrainNumber,ServiceNumber:serviceNumber,PostId:currentPost?.dispatcherPost||'',Channel:'',Group:radioGroup,SourceDestinationIdentifier:Number(sourceDestination),MessageIdentifier:Number(messageIdentifier),Kind:kind,Text:text};
 let lastError='';
 for(let attempt=1;attempt<=3;attempt++){
  status('A transmitir no GR '+radioGroup+' para '+(currentPost?.dispatcherPost||'o posto')+(attempt>1?' · repetição '+(attempt-1)+'/2':'')+'…');
  try{
   const r=await fetch('/API/CPV/RADIO',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const result=await r.json();
   if(result.Accepted){
    $('text').value='';
    status('MENSAGEM TRANSMITIDA · ACK 06 · UUS1 0x'+Number(result.AcknowledgementCause||0).toString(16).padStart(2,'0')+' · registo '+result.MessageId);
    if(kind==='alarm'){$('alarm').style.background='#55110d';setTimeout(()=>$('alarm').style.background='#050708',1800)}
    await refresh();return true
   }
   lastError=result.Message+' · causa 0x'+Number(result.AcknowledgementCause??3).toString(16).padStart(2,'0');
   if(Number(result.AcknowledgementCause)!==2)break
  }catch(e){lastError=e.message}
 }
 status('FALHA EM TRANSM DADOS · '+lastError,true);return false
}
async function registerTerminal(){if(!Number.isFinite(serviceNumber)){status('Introduz primeiro o número do comboio.',true);return}if(!radioGroup){status('Introduz primeiro o grupo de frequências.',true);return}if(!await send('LOGIN','status',true,1,15))return;registered=true;display();localStorage.setItem('cpvRadioRegistration',JSON.stringify({simulatorTrainNumber,serviceNumber,postId:currentPost?.dispatcherPost||'',channel:'',group:radioGroup}));status('REGISTADO · GR '+radioGroup+' · serviço '+serviceNumber)}
async function refresh(){try{const [rr,sr]=await Promise.all([fetch('/API/CPV/RADIO',{cache:'no-store'}),fetch('/API/CPV/STATE',{cache:'no-store'})]);if(!rr.ok||!sr.ok)throw new Error('sem ligação');const all=await rr.json(),postId=currentPost?.dispatcherPost||'',messages=all.filter(m=>(m.TrainNumber===simulatorTrainNumber||m.TrainNumber<0)&&(!postId||!m.PostId||m.PostId===postId)&&(!m.Group||m.Group===radioGroup)),state=await sr.json();$('connection').textContent='● RSC LIGADO · GR '+radioGroup;$('connection').className='ok';lastReceived=[...messages].reverse().find(m=>m.FromRole==='dispatcher')||lastReceived;$('messages').innerHTML=messages.length?messages.map(m=>'<div class="msg '+esc(m.FromRole)+'"><small>'+esc(m.FromName)+' · '+'GR '+esc(m.Group||radioGroup)+(m.SourceDestinationIdentifier?' · 0x'+Number(m.SourceDestinationIdentifier).toString(16).padStart(2,'0')+'/'+m.MessageIdentifier:'')+' · '+new Date(m.SentAtUtc).toLocaleTimeString()+'</small>'+esc(m.Text)+'</div>').join(''):'<div class="msg"><small>SISTEMA</small>GR '+esc(radioGroup)+' iniciado.</div>';if(messages.length&&messages[messages.length-1].MessageId!==lastId){lastId=messages[messages.length-1].MessageId;$('messages').scrollTop=$('messages').scrollHeight}}catch(e){$('connection').textContent='● RSC SEM LIGAÇÃO';$('connection').className='';status('SEM LIGAÇÃO AO POSTO',true)}}
document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>send(b.dataset.send,b.dataset.kind,false,Number(b.dataset.source||0),Number(b.dataset.message||0)));
document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{if(!entryMode){status('Seleciona NUM COMBOIO ou CANAL GRUPO antes de escrever.',true);return}numericEntry=(numericEntry+b.dataset.digit).slice(-5);display();status((entryMode==='group'?'Grupo de frequências: ':'Número do comboio: ')+numericEntry)});
document.querySelectorAll('[data-volume]').forEach(b=>b.onclick=()=>{volume=Math.max(0,Math.min(7,volume+Number(b.dataset.volume)));renderVolume();status('Volume '+volume)});
document.querySelector('[data-action="train-number"]').onclick=()=>{entryMode='train';numericEntry='';display();status('Introduz o número do comboio e prime ENTRADA NÚMERO')};
document.querySelector('[data-action="channel"]').onclick=()=>{entryMode='group';numericEntry='';display();status('Introduz o grupo de frequências e prime ENTRADA NÚMERO')};
document.querySelector('[data-action="enter"]').onclick=()=>{if(!numericEntry){status('Nenhum número introduzido.',true);return}if(entryMode==='train')serviceNumber=Number(numericEntry);else if(entryMode==='group')radioGroup=numericEntry;entryMode='';numericEntry='';registered=false;display();status('Valor confirmado. Prime REG para registar o terminal.')};
document.querySelector('[data-action="cancel"]').onclick=()=>{entryMode='';numericEntry='';display();status('Introdução anulada')};
document.querySelector('[data-action="reg"]').onclick=registerTerminal;
document.querySelector('[data-action="review-reg"]').onclick=()=>status(registered?'REGISTO ATIVO · GR '+radioGroup+' · serviço '+serviceNumber:'TERMINAL NÃO REGISTADO');
document.querySelector('[data-action="review"]').onclick=()=>status(lastReceived?'ÚLTIMA RECEÇÃO · '+lastReceived.FromName+': '+lastReceived.Text:'Sem mensagens recebidas.');
document.querySelector('[data-action="end"]').onclick=async()=>{if(registered)await send('LOGOUT','status',false,1,16);registered=false;localStorage.removeItem('cpvRadioRegistration');display();status('REGISTO TERMINADO')};
document.querySelector('[data-action="mode"]').onclick=()=>status('MODO CP-N · operação simplex/semi-duplex gerida pelo posto regulador.');
document.querySelector('[data-action="test"]').onclick=()=>{status('TESTE DO TERMINAL · visor e indicadores operacionais');$('alarm').style.background='#3e2510';setTimeout(()=>$('alarm').style.background='#050708',1200)};
document.querySelector('[data-action="compose"]').onclick=()=>$('text').focus();document.querySelector('[data-action="logout"]').onclick=()=>location.href='/CPVirtual/';
document.querySelector('[data-action="indicator"]').onclick=()=>status('Indicador de receção/transmissão.');
$('send').onclick=()=>send($('text').value);$('text').onkeydown=e=>{if(e.key==='Enter')send($('text').value)};
const saved=JSON.parse(localStorage.getItem('cpvRadioRegistration')||'null');if(saved&&saved.simulatorTrainNumber===simulatorTrainNumber&&saved.serviceNumber===serviceNumber){registered=true;radioChannel='';radioGroup=String(saved.group||'62')}
renderVolume();display();loadPost().then(refresh);setInterval(refresh,1000);
</script></body></html>
