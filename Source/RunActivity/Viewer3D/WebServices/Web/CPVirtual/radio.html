<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CP Virtual · Rádio Solo–Comboio</title><style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#edf2f4;background:#081014;--green:#55dc8b;--red:#e12830;--card:#172126;--border:#344149}*{box-sizing:border-box}body{margin:0}header{height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;background:#182126;border-bottom:3px solid var(--red)}header b{color:var(--red);font-size:23px;font-style:italic}.ok{color:#8ee2ad}main{max-width:900px;margin:28px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:17px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:15px}.head h1{font-size:21px;margin:0}.head p{margin:5px 0 0;color:#aab7bd;font-size:12px}.train{font-family:Consolas,monospace;color:#8ee2ad}.messages{height:390px;overflow:auto;background:#0d1519;border-radius:7px;padding:12px}.msg{border-left:3px solid #5d727c;padding:8px 10px;margin-bottom:8px;background:#121c21;font-size:13px}.msg.driver{border-color:#55dc8b}.msg.dispatcher{border-color:#ffd252}.msg small{display:block;color:#91a1a8;margin-bottom:4px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.quick button,button.send{border:1px solid #53636b;background:#26353c;color:#edf2f4;border-radius:5px;padding:8px 11px;cursor:pointer}.quick button:hover,button.send:hover{background:#344750}.compose{display:grid;grid-template-columns:1fr auto;gap:8px}input{background:#0d1519;border:1px solid #4b5961;border-radius:5px;color:#fff;padding:11px}.status{font-size:12px;color:#aab7bd;margin-top:8px}.back{color:#b9c6cc;text-decoration:none}</style></head><body>
<header><div><b>CP</b> VIRTUAL · RÁDIO SOLO–COMBOIO</div><div id="connection">A ligar…</div></header><main>
<section class="card head"><div><h1>Terminal do maquinista</h1><p id="operator">Serviço não identificado</p></div><div id="train" class="train">COMBOIO —</div></section>
<section class="card"><div id="messages" class="messages"><div class="msg"><small>SISTEMA</small>Canal iniciado. A aguardar comunicações.</div></div>
<div class="quick"><button data-text="Pedido de autorização para ultrapassar sinal fechado." data-kind="permission">PEDIR AUTORIZAÇÃO</button><button data-text="Comboio imobilizado. Solicito instruções." data-kind="assistance">PEDIR INSTRUÇÕES</button><button data-text="Mensagem recebida e compreendida." data-kind="ack">CONFIRMAR RECEÇÃO</button></div>
<div class="compose"><input id="text" maxlength="240" placeholder="Mensagem para o controlador de tráfego"><button id="send" class="send">TRANSMITIR</button></div><div id="status" class="status">Canal pronto.</div></section>
<a class="back" href="/CPVirtual/">← Terminar/alterar serviço</a></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),trainNumber=Number(params.get('train')),duty=JSON.parse(localStorage.getItem('cpvDuty')||'{}');let lastId=0;
$('train').textContent='COMBOIO '+(Number.isFinite(trainNumber)?trainNumber:'—');$('operator').textContent=(duty.name||'Maquinista')+' · serviço '+(Number.isFinite(trainNumber)?trainNumber:'—');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function send(text,kind='radio'){text=String(text||'').trim();if(!text)return;$('status').textContent='A transmitir…';try{const r=await fetch('/API/CPV/RADIO',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({FromRole:'driver',FromName:duty.name||'Maquinista',TrainNumber:trainNumber,PostId:'',Kind:kind,Text:text})});const result=await r.json();if(!result.Accepted)throw new Error(result.Message);$('text').value='';$('status').textContent='Transmitido: mensagem '+result.MessageId;await refresh()}catch(e){$('status').textContent='Falha: '+e.message}}
async function refresh(){try{const [rr,sr]=await Promise.all([fetch('/API/CPV/RADIO',{cache:'no-store'}),fetch('/API/CPV/STATE',{cache:'no-store'})]);if(!rr.ok||!sr.ok)throw new Error('sem ligação');const messages=(await rr.json()).filter(m=>m.TrainNumber===trainNumber||m.TrainNumber<0);const state=await sr.json(),train=(state.Trains||[]).find(t=>t.Number===trainNumber);$('connection').textContent='● RSC LIGADO';$('connection').className='ok';$('train').textContent='COMBOIO '+trainNumber+(train?' · '+Number(train.SpeedKmh||0).toFixed(1)+' km/h':'');$('messages').innerHTML=messages.length?messages.map(m=>'<div class="msg '+esc(m.FromRole)+'"><small>'+esc(m.FromName)+' · '+new Date(m.SentAtUtc).toLocaleTimeString()+'</small>'+esc(m.Text)+'</div>').join(''):'<div class="msg"><small>SISTEMA</small>Canal iniciado. A aguardar comunicações.</div>';if(messages.length&&messages[messages.length-1].MessageId!==lastId){lastId=messages[messages.length-1].MessageId;$('messages').scrollTop=$('messages').scrollHeight}}catch(e){$('connection').textContent='● RSC SEM LIGAÇÃO';$('connection').className=''}}
document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>send(b.dataset.text,b.dataset.kind));$('send').onclick=()=>send($('text').value);$('text').onkeydown=e=>{if(e.key==='Enter')send($('text').value)};refresh();setInterval(refresh,1000);
</script></body></html>
